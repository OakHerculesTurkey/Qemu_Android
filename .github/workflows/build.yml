name: Build QEMU for Android

on:
  push:
    branches: ["**"]
  pull_request:
  workflow_dispatch:
    inputs:
      release:
        description: "Publish the APK as a GitHub Release"
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-24.04
    strategy:
      fail-fast: false
      matrix:
        abi: [arm64-v8a, x86_64]
    env:
      ANDROID_ABI: ${{ matrix.abi }}
    steps:
      - uses: actions/checkout@v4

      - name: Host tools
        run: |
          ./scripts/setup-host.sh
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"

      - name: Cache NDK and sources
        uses: actions/cache@v4
        with:
          path: |
            work/dl
            work/src
            work/android-ndk-*
          key: sources-${{ hashFiles('scripts/env.sh', 'scripts/fetch.sh', 'patches/**') }}

      - name: Build
        run: ./build.sh

      - uses: actions/upload-artifact@v4
        with:
          name: qemu-android-${{ matrix.abi }}
          path: dist/*.tar.gz

      - name: Java for the Android app
        if: matrix.abi == 'arm64-v8a'
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "21"

      - name: Build APK
        if: matrix.abi == 'arm64-v8a'
        env:
          KEYSTORE_B64: ${{ secrets.QEMU_KEYSTORE_B64 }}
          QEMU_KEYSTORE_PASSWORD: ${{ secrets.QEMU_KEYSTORE_PASSWORD }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.jks"
            export QEMU_KEYSTORE="$RUNNER_TEMP/release.jks"
          fi
          ./scripts/build-apk.sh
          rm -f "$RUNNER_TEMP/release.jks"

      - uses: actions/upload-artifact@v4
        if: matrix.abi == 'arm64-v8a'
        with:
          name: qemu-android-apk
          path: dist/*.apk

      - name: Publish release
        if: matrix.abi == 'arm64-v8a' && github.event_name == 'workflow_dispatch' && inputs.release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          ver="$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android-app/app/build.gradle.kts)"
          gh release create "v$ver" dist/*.apk dist/*.tar.gz \
            --target "$GITHUB_SHA" --title "QEMU Android $ver" \
            --notes "APK: qemu-android-$ver.apk (arm64-v8a). Native QEMU bundles: *.tar.gz." \
            || gh release upload "v$ver" dist/*.apk dist/*.tar.gz --clobber
